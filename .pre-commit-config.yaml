repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: double-quote-string-fixer
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix", "lf"]
      # - id: no-commit-to-branch
      #   args: ["--branch", "main", "--branch", "master", "--branch", "dev"]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-browser-dialogs
        name: no alert/confirm/prompt/hx-confirm
        entry: scripts/checks/no_browser_dialogs.sh
        language: script
        files: ^(app/templates/|static/js/)
        exclude: \.min\.js$
