{% extends 'public/base.html' %}

{% block title %}{{ title }} — {{ site_name }}{% endblock %}

{% block seo %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto px-4 md:px-6 py-20 md:py-32 text-center">
    <div class="text-6xl font-extrabold text-brand-600 mb-4">{{ status_code }}</div>
    <h1 class="text-2xl font-bold mb-3">{{ title }}</h1>
    <p class="text-ink-muted mb-8">{{ detail }}</p>
    <a href="/" class="btn btn-primary">На главную</a>
</section>
{% endblock %}
