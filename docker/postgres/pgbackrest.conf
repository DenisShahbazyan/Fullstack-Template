# Здесь только то, что одинаково везде. Бакет, эндпоинт, ключи и пароль
# шифрования приходят переменными PGBACKREST_* из .env.docker.

[global]
repo1-type=s3
repo1-path=/postgres
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc

# Полный бэкап раз в сутки, храним по времени: всё, что нужно для
# восстановления на любой момент последних 7 суток. По количеству ручные
# бэкапы (pg-backup перед миграцией) вытесняли бы старые и сужали окно.
# WAL старше самого старого бэкапа pgBackRest удаляет сам.
repo1-retention-full-type=time
repo1-retention-full=7

# zst в Alpine-сборку pgBackRest не включён, lz4 — быстрый и почти не грузит CPU.
compress-type=lz4
start-fast=y
process-max=2

# Лог в файл внутри контейнера пропал бы при пересоздании. Вывод бэкапа
# уходит в docker logs postgres_backup, ошибки archive-push — в лог Postgres.
log-level-console=info
log-level-file=off

[main]
pg1-path=/var/lib/postgresql/18/docker
